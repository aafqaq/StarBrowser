name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($packageVersion -ne $tagVersion) { throw "package.json 版本 $packageVersion 与标签 $tagVersion 不一致" }

      - name: Install and verify
        run: |
          npm ci
          npm audit --audit-level=high
          npm run test:update
          npm run test:update:extract
          npm run test:update:ui
          npm run test:update:handoff
          npm run test:plugins
          npm run typecheck

      - name: Build portable Windows folder
        run: npm run dist

      - name: Test packaged session import and browser lifecycle
        run: npm run test:smoke

      - name: Test portable updater handoff and locked ASAR cleanup
        run: npm run test:update:integration

      - name: Create full and lightweight update packages
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $fullArchive = "StarBrowser-Windows-x64-v$version.zip"
          $appArchive = "StarBrowser-App-v$version.zip"
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath dist | ForEach-Object FullName) -DestinationPath $fullArchive -CompressionLevel Optimal
          $appPayload = Join-Path $env:RUNNER_TEMP "starbrowser-app-payload"
          New-Item -ItemType Directory -Path (Join-Path $appPayload "resources") -Force | Out-Null
          Copy-Item -LiteralPath "dist/resources/app.asar" -Destination (Join-Path $appPayload "resources/app.asar")
          Copy-Item -LiteralPath "dist/starbrowser-update.json" -Destination (Join-Path $appPayload "starbrowser-update.json")
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath $appPayload | ForEach-Object FullName) -DestinationPath $appArchive -CompressionLevel Optimal
          node scripts/create-update-manifest.mjs $fullArchive $appArchive latest.json
          "FULL_ARCHIVE_NAME=$fullArchive" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_ARCHIVE_NAME=$appArchive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:FULL_ARCHIVE_NAME" "$env:APP_ARCHIVE_NAME" latest.json --title "StarBrowser ${{ github.ref_name }}" --generate-notes --verify-tag
