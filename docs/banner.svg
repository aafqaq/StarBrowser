<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-label="StarBrowser Windows 会话隔离浏览器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111327"/>
      <stop offset=".5" stop-color="#24205a"/>
      <stop offset="1" stop-color="#12172d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#756eff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#756eff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1440" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="1160" cy="90" r="245" fill="url(#glow)"/>
  <circle cx="210" cy="430" r="235" fill="url(#glow)" opacity=".48"/>
  <g opacity=".7" fill="#fff">
    <circle cx="92" cy="76" r="2"/><circle cx="180" cy="108" r="1.5"/>
    <circle cx="320" cy="54" r="2"/><circle cx="520" cy="94" r="1.5"/>
    <circle cx="1320" cy="310" r="2"/><circle cx="1240" cy="360" r="1.5"/>
  </g>
  <image href="brand-logo.png" x="954" y="43" width="340" height="340" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
  <g transform="translate(92 94)">
    <text x="0" y="70" fill="#fff" font-family="Segoe UI Variable,Segoe UI,sans-serif" font-size="72" font-weight="750" letter-spacing="-2">StarBrowser</text>
    <text x="3" y="125" fill="#dedff5" font-family="Microsoft YaHei UI,Segoe UI,sans-serif" font-size="27" font-weight="600">Windows 会话隔离浏览器</text>
    <text x="3" y="174" fill="#b8b9d5" font-family="Microsoft YaHei UI,Segoe UI,sans-serif" font-size="21">多账号独立登录 · 会话持久保存 · Chromium 内核 · 便携免安装</text>
    <line x1="3" y1="213" x2="560" y2="213" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="3" y="255" fill="#8588aa" font-family="Microsoft YaHei UI,Segoe UI,sans-serif" font-size="16">Windows 10 / 11 · Electron · Vue 3</text>
  </g>
</svg>
